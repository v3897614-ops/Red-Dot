<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Don’t Click The Red Dot</title>
<meta name="description" content="A tiny red dot. Click it. Keep clicking. What could go wrong?">
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { height: 100%; margin: 0; background: #fff; color: #222; font-family: "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #dot { position: absolute; border-radius: 50%; background: #e11; border: 0; padding: 0; cursor: pointer;
         transition: width .12s ease-out, height .12s ease-out; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #dot:active { filter: brightness(.9); }
  #count { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 0; right: 0; text-align: center; font-size: 18px; color: #888; pointer-events: none; }
  #boom { position: absolute; width: min(90vmin, 520px); aspect-ratio: 1; display: none; text-align: center; }
  #boom.go { display: block; animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; }
  #boom svg { width: 100%; height: 100%; overflow: visible; }
  #boom .txt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: min(18vmin, 90px); font-weight: 900; color: #d00; letter-spacing: 2px; transform: rotate(-8deg); text-shadow: 3px 3px 0 #fff; }
  #msg { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 8vh); text-align: center; opacity: 0; transition: opacity .5s .6s; padding: 0 16px; }
  #msg.show { opacity: 1; }
  #msg h1 { margin: 0 0 14px; font-size: clamp(24px, 6vw, 40px); }
  #msg button { font: inherit; font-size: 18px; padding: 10px 22px; border-radius: 999px; border: 3px solid #222; background: #ffe14d; cursor: pointer; }
  .bit { position: absolute; border-radius: 50%; background: #e11; transition: transform .9s cubic-bezier(.1,.7,.3,1), opacity .9s; }
  .shake { animation: shake .45s; }
  @keyframes pop { from { transform: scale(0) rotate(-30deg); } to { transform: scale(1) rotate(0); } }
  @keyframes shake { 0%,100% { transform: translate(0); } 20% { transform: translate(-14px, 8px); } 40% { transform: translate(12px, -10px); } 60% { transform: translate(-10px, -6px); } 80% { transform: translate(8px, 10px); } }
</style>
</head>
<body>
<div id="count">Clicks: 0 / 50</div>
<div id="stage">
  <button id="dot" aria-label="Red dot, click me"></button>
  <div id="boom">
    <svg viewBox="-100 -100 200 200" aria-hidden="true">
      <polygon id="burst2" fill="#e11" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
      <polygon id="burst" fill="#ffd21f" stroke="#222" stroke-width="3" stroke-linejoin="round" transform="scale(.72) rotate(12)"/>
    </svg>
    <div class="txt">BOOM!</div>
  </div>
</div>
<div id="msg">
  <h1>You clicked too many times! 💥</h1>
  <button id="again">Try again</button>
</div>
<script>
(function () {
  var MAX = 50, START = 12, n = 0, done = false;
  var dot = document.getElementById('dot'), count = document.getElementById('count'),
      boom = document.getElementById('boom'), msg = document.getElementById('msg'),
      stage = document.getElementById('stage');

  function star(spikes, outer, inner) {
    var pts = [];
    for (var i = 0; i < spikes * 2; i++) {
      var r = i % 2 ? inner : outer, a = Math.PI * i / spikes;
      pts.push((Math.cos(a) * r).toFixed(1) + ',' + (Math.sin(a) * r).toFixed(1));
    }
    return pts.join(' ');
  }
  document.getElementById('burst2').setAttribute('points', star(14, 98, 62));
  document.getElementById('burst').setAttribute('points', star(11, 98, 60));

  function size() {
    var maxSize = Math.min(window.innerWidth, window.innerHeight) * 0.85;
    return START + (maxSize - START) * (n / MAX);
  }
  function render() {
    var s = size();
    dot.style.width = dot.style.height = s + 'px';
    count.textContent = 'Clicks: ' + n + ' / ' + MAX;
  }

  function explode() {
    done = true;
    var r = dot.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    dot.style.display = 'none';
    stage.classList.add('shake');
    boom.classList.add('go');
    for (var i = 0; i < 28; i++) {
      var b = document.createElement('div'), d = 8 + Math.random() * 18;
      b.className = 'bit';
      b.style.cssText = 'width:' + d + 'px;height:' + d + 'px;left:' + (cx - d / 2) + 'px;top:' + (cy - d / 2) + 'px';
      document.body.appendChild(b);
      (function (el) {
        var a = Math.random() * Math.PI * 2, dist = 120 + Math.random() * Math.max(window.innerWidth, window.innerHeight) * 0.5;
        requestAnimationFrame(function () {
          el.style.transform = 'translate(' + Math.cos(a) * dist + 'px,' + Math.sin(a) * dist + 'px) scale(.3)';
          el.style.opacity = '0';
        });
        setTimeout(function () { el.remove(); }, 1000);
      })(b);
    }
    msg.classList.add('show');
  }

  dot.addEventListener('click', function () {
    if (done) return;
    n++;
    if (n >= MAX) { render(); explode(); } else { render(); }
  });

  document.getElementById('again').addEventListener('click', function () {
    n = 0; done = false;
    boom.classList.remove('go');
    stage.classList.remove('shake');
    msg.classList.remove('show');
    dot.style.display = '';
    render();
  });

  window.addEventListener('resize', function () { if (!done) render(); });
  render();
})();
</script>
</body>
</html>
